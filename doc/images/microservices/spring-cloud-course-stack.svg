<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">本课 Spring Cloud 治理栈与组件演进</title>
  <desc id="desc">从上到下：组件演进路径，以及本课 Gateway、Nacos、OpenFeign、Sentinel 与业务服务的关系</desc>
  <defs>
    <style>
      .t { font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; fill: #1a1a1a; }
      .s { font-size: 13px; }
      .h { font-size: 15px; font-weight: 600; }
      .m { font-size: 12px; fill: #444; }
      .box { stroke: #2f3b4a; stroke-width: 1.5; }
      .muted { fill: #f3f5f7; }
      .accent { fill: #e8f1fb; }
      .ok { fill: #e7f6ed; }
      .old { fill: #f7f1e8; }
      .arr { stroke: #2f3b4a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f3b4a"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <text x="24" y="28" class="t h">组件演进（治理能力不变，实现更迭）</text>

  <rect x="24" y="44" width="280" height="78" rx="6" class="box old"/>
  <text x="40" y="68" class="t h">早期常见实现</text>
  <text x="40" y="90" class="t s">Eureka · Ribbon · Zuul · Hystrix</text>
  <text x="40" y="108" class="t m">发现 / 客户端负载 / 网关 / 熔断</text>

  <path d="M316 83 H356" class="arr"/>

  <rect x="368" y="44" width="280" height="78" rx="6" class="box accent"/>
  <text x="384" y="68" class="t h">Spring 官方替代方向</text>
  <text x="384" y="90" class="t s">LoadBalancer · Gateway · CircuitBreaker</text>
  <text x="384" y="108" class="t m">（Resilience4j 等）</text>

  <path d="M660 83 H700" class="arr"/>

  <rect x="712" y="44" width="224" height="78" rx="6" class="box ok"/>
  <text x="728" y="68" class="t h">本课默认实现</text>
  <text x="728" y="90" class="t s">Nacos · Gateway · Sentinel</text>
  <text x="728" y="108" class="t m">+ OpenFeign</text>

  <text x="24" y="160" class="t h">本课 Spring Cloud 栈（开发态治理）</text>
  <text x="24" y="180" class="t m">能力用 Spring Cloud 编程模型接入；Nacos / Sentinel 是开源组件实现，不等于云厂商绑定</text>

  <rect x="300" y="200" width="360" height="52" rx="6" class="box accent"/>
  <text x="480" y="232" text-anchor="middle" class="t h">Client → Spring Cloud Gateway（路由 / JWT / 灰度头）</text>

  <path d="M480 252 V278" class="arr"/>

  <rect x="120" y="286" width="200" height="88" rx="6" class="box ok"/>
  <text x="220" y="316" text-anchor="middle" class="t h">Nacos</text>
  <text x="220" y="338" text-anchor="middle" class="t s">注册发现</text>
  <text x="220" y="358" text-anchor="middle" class="t s">配置热更新</text>

  <rect x="380" y="286" width="200" height="88" rx="6" class="box ok"/>
  <text x="480" y="316" text-anchor="middle" class="t h">OpenFeign</text>
  <text x="480" y="338" text-anchor="middle" class="t s">+ LoadBalancer</text>
  <text x="480" y="358" text-anchor="middle" class="t s">同步服务调用</text>

  <rect x="640" y="286" width="200" height="88" rx="6" class="box ok"/>
  <text x="740" y="316" text-anchor="middle" class="t h">Sentinel</text>
  <text x="740" y="338" text-anchor="middle" class="t s">限流 / 熔断 / 降级</text>
  <text x="740" y="358" text-anchor="middle" class="t s">（Resilience4j 对照）</text>

  <path d="M220 374 V400" class="arr"/>
  <path d="M480 374 V400" class="arr"/>
  <path d="M740 374 V400" class="arr"/>
  <path d="M220 400 H740" class="arr" marker-end="none"/>
  <path d="M480 400 V418" class="arr"/>

  <rect x="200" y="426" width="560" height="68" rx="6" class="box muted"/>
  <text x="480" y="454" text-anchor="middle" class="t h">业务服务：order / inventory / user …</text>
  <text x="480" y="476" text-anchor="middle" class="t s">进程内 SDK 完成发现、调用与韧性；运行在 Kubernetes Namespace ms-lab</text>
</svg>
