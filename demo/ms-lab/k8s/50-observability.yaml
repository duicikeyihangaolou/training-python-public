apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ms-lab
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: xdel6itq0zfw8s.xuanyuan.run/grafana/grafana:11.2.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits: {cpu: "200m", memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ms-lab
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30890}]
