apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:6.2.16-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {cpu: "200m", memory: 128Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ms-lab
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: ms-lab
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: nacos}}
  template:
    metadata: {labels: {app: nacos}}
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.3.2
          imagePullPolicy: IfNotPresent
          # 每次容器启动清 Derby，避免 CrashLoop 残留半截库（initContainer 不会随 restart 重跑）
          command: ["/bin/bash", "-c"]
          args:
            - "rm -rf /home/nacos/data/* /home/nacos/logs/*; mkdir -p /home/nacos/data /home/nacos/logs; exec /home/nacos/bin/docker-startup.sh"
          env:
            - {name: MODE, value: standalone}
            - {name: PREFER_HOST_MODE, value: hostname}
            - {name: JVM_XMS, value: 256m}
            - {name: JVM_XMX, value: 512m}
            - {name: NACOS_AUTH_ENABLE, value: "false"}
            - {name: NACOS_AUTH_TOKEN, value: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg="}
            - {name: NACOS_AUTH_IDENTITY_KEY, value: serverIdentity}
            - {name: NACOS_AUTH_IDENTITY_VALUE, value: security}
            - {name: JAVA_OPT_EXT, value: "-Dderby.stream.error.file=/home/nacos/logs/derby.log"}
          ports:
            - {containerPort: 8848}
            - {containerPort: 9848}
            - {containerPort: 9849}
          resources:
            requests: {cpu: "200m", memory: 1Gi}
            limits: {cpu: "2000m", memory: 2Gi}
          volumeMounts:
            - {name: nacos-data, mountPath: /home/nacos/data}
            - {name: nacos-logs, mountPath: /home/nacos/logs}
          startupProbe:
            tcpSocket: {port: 8848}
            initialDelaySeconds: 25
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /nacos/, port: 8848}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
      volumes:
        - name: nacos-data
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        - name: nacos-logs
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: ms-lab
spec:
  type: NodePort
  selector: {app: nacos}
  ports:
    - {name: http, port: 8848, targetPort: 8848, nodePort: 30848}
    - {name: grpc, port: 9848, targetPort: 9848}
    - {name: grpc-old, port: 9849, targetPort: 9849}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
          ports:
            - {containerPort: 16686}
            - {containerPort: 4318}
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits: {cpu: "300m", memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ms-lab
spec:
  type: NodePort
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: 16686, nodePort: 30891}
    - {name: otlp, port: 4318, targetPort: 4318}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ms-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: gateway
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ["gateway:8080"]}]
      - job_name: order
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ["order-service:8080"]}]
      - job_name: inventory
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ["inventory-service:8080"]}]
      - job_name: user
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ["user-service:8080"]}]
      - job_name: recommend-bff
        metrics_path: /actuator/prometheus
        static_configs: [{targets: ["recommend-bff:8080"]}]
      # Python 模型服务（BentoML 内置 /metrics，含 recommend_latency_seconds 等自定义指标）
      - job_name: recommend
        metrics_path: /metrics
        static_configs: [{targets: ["recommend:8080", "recommend-canary:8080"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=6h"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: cfg, mountPath: /etc/prometheus}
          resources:
            requests: {cpu: "50m", memory: 128Mi}
            limits: {cpu: "300m", memory: 384Mi}
      volumes:
        - name: cfg
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ms-lab
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30892}]
