---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-detector
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: aiops-detector}}
  template:
    metadata: {labels: {app: aiops-detector}}
    spec:
      serviceAccountName: aiops-detector
      containers:
        - name: aiops-detector
          image: ms-lab/aiops-detector:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: PROM_URL, value: "http://prometheus:9090"}
            - {name: JAEGER_URL, value: "http://jaeger:16686"}
            - {name: NAMESPACE, value: "ms-lab"}
            - {name: WINDOW, value: "30"}
            - {name: DAY_THR, value: "0.99"}
            - {name: NIGHT_THR, value: "0.85"}
            - {name: TZ_NAME, value: "Asia/Shanghai"}
            - {name: NIGHT_START, value: "0"}
            - {name: NIGHT_END, value: "7"}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "800m", memory: 768Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-detector
  namespace: ms-lab
spec:
  type: ClusterIP
  selector: {app: aiops-detector}
  ports: [{port: 8080, targetPort: 8080}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-governor
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: ai-governor}}
  template:
    metadata: {labels: {app: ai-governor}}
    spec:
      serviceAccountName: ai-governor
      containers:
        - name: ai-governor
          image: ms-lab/ai-governor:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: PROM_URL, value: "http://prometheus:9090"}
            - {name: NAMESPACE, value: "ms-lab"}
            - {name: SCALE_TARGET, value: "recommend"}
            - {name: ROUTE_CANDIDATES, value: "recommend:8080,recommend-canary:8080"}
            - {name: QPS_PER_REPLICA, value: "5"}
            - {name: MIN_REPLICAS, value: "1"}
            - {name: MAX_REPLICAS, value: "3"}
            # 默认只输出建议；改为 "true" 才会 patch Deployment 副本数
            - {name: APPLY, value: "false"}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "800m", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-governor
  namespace: ms-lab
spec:
  type: ClusterIP
  selector: {app: ai-governor}
  ports: [{port: 8080, targetPort: 8080}]
