apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: user-service}}
  template:
    metadata: {labels: {app: user-service}}
    spec:
      containers:
        - name: user-service
          image: ms-lab/user-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: NACOS_ADDR, value: "nacos:8848"}
            - {name: REDIS_HOST, value: "redis"}
            - {name: SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST, value: "false"}
            - {name: SPRING_CLOUD_NACOS_DISCOVERY_REGISTER_ENABLED, value: "true"}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "800m", memory: 640Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ms-lab
spec:
  type: ClusterIP
  selector: {app: user-service}
  ports: [{port: 8080, targetPort: 8080}]

