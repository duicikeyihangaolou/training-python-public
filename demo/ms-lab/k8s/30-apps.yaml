---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ms-lab
spec:
  replicas: 1
  # H2 文件库不可双实例；滚动更新会双 Pod 抢锁
  strategy: {type: Recreate}
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
        - name: order-service
          image: ms-lab/order-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: NACOS_ADDR, value: "nacos:8848"}
            - {name: REDIS_HOST, value: "redis"}
            - {name: INVENTORY_URL, value: "http://inventory-service:8080"}
            - {name: SPRING_CLOUD_NACOS_DISCOVERY_FAIL_FAST, value: "false"}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "800m", memory: 640Mi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            initialDelaySeconds: 25
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 10

      volumes:
        - name: data
          hostPath: {path: /data/ms-lab, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ms-lab
spec:
  type: ClusterIP
  selector: {app: order-service}
  ports: [{port: 8080, targetPort: 8080}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend
  namespace: ms-lab
spec:
  replicas: 1
  selector: {matchLabels: {app: recommend}}
  template:
    metadata: {labels: {app: recommend}}
    spec:
      # 镜像内置 v1/v2 初始权重；拷到可写 emptyDir 后，热加载（POST /admin/reload-model）从 /models 读取
      initContainers:
        - name: seed-models
          image: ms-lab/model-service:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -f /app/models/*.pt /models/"]
          volumeMounts:
            - {name: models, mountPath: /models}
          resources:
            requests: {cpu: "10m", memory: 32Mi}
            limits: {cpu: "200m", memory: 128Mi}
      containers:
        - name: recommend
          image: ms-lab/model-service:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: MODEL_VERSION, value: "v1"}
            - {name: MODEL_DIR, value: "/models"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://jaeger:4318/v1/traces"}
          volumeMounts:
            - {name: models, mountPath: /models}
          resources:
            requests: {cpu: "100m", memory: 512Mi}
            limits: {cpu: "1000m", memory: 1280Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: recommend
  namespace: ms-lab
spec:
  type: ClusterIP
  selector: {app: recommend}
  ports: [{port: 8080, targetPort: 8080}]
