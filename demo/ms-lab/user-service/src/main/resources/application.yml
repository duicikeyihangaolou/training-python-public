server:
  port: 8080
spring:
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        prefer-ip-address: true
        namespace: ${NACOS_NS:public}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_URL:http://jaeger:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
